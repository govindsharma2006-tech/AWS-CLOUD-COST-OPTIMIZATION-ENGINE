<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CloudLens — Redirecting</title>
  <meta http-equiv="refresh" content="3;url=/" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@400&display=swap" rel="stylesheet" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Syne',sans-serif;background:#030508;color:#f8fafc;min-height:100vh;display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
    .card{text-align:center;padding:48px 40px;background:#111828;border:1px solid rgba(255,255,255,0.07);border-radius:22px;box-shadow:0 10px 40px rgba(0,0,0,.65),0 0 50px rgba(14,165,233,.08)}
    .hex{width:52px;height:52px;background:linear-gradient(135deg,#0ea5e9,#0f766e);clip-path:polygon(50% 0%,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);display:flex;align-items:center;justify-content:center;font-size:22px;margin:0 auto 24px;box-shadow:0 0 40px rgba(14,165,233,.3)}
    h1{font-size:20px;font-weight:800;letter-spacing:-.3px;margin-bottom:10px}
    p{font-family:'DM Mono',monospace;font-size:12px;color:#94a3b8;letter-spacing:.5px}
    .note{margin-top:16px;font-size:12px;color:#475569}
    a{color:#0ea5e9;text-decoration:none}
    a:hover{text-decoration:underline}
  </style>
</head>
<body>
  <div class="card">
    <div class="hex">⬡</div>
    <h1>Password Reset Removed</h1>
    <p>CloudLens now uses Google Sign-In only.</p>
    <p class="note">Redirecting to <a href="/">home</a> in 3 seconds…</p>
  </div>
</body>
</html>
